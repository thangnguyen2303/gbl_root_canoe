name: Build HyperOS fake unlock

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct HTTPS link to a HyperOS recovery ROM (.zip)"
        required: true
        type: string
      artifact_days:
        description: "Days to retain the result (1-30)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: fake-unlock-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  patch-abl:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ROM_URL: ${{ inputs.rom_url }}
      TOOLKIT: targets/toolkit_linux/build/toolkit

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$ROM_URL" in
            https://*) ;;
            *) echo "::error::rom_url must be a direct HTTPS URL"; exit 1 ;;
          esac

          days='${{ inputs.artifact_days }}'
          if ! [[ "$days" =~ ^[0-9]+$ ]] || (( days < 1 || days > 30 )); then
            echo "::error::artifact_days must be an integer from 1 to 30"
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm uuid-dev liblzma-dev zip unzip curl ca-certificates

      - name: Build Linux toolkit
        shell: bash
        run: |
          set -euo pipefail
          make target_toolkit_linux
          test -x "$TOOLKIT/bin/extractfv"
          test -x "$TOOLKIT/bin/patch_abl"

      - name: Download recovery ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
            --output work/rom.zip "$ROM_URL"
          unzip -tq work/rom.zip >/dev/null
          echo "Downloaded: $(du -h work/rom.zip | cut -f1)"

      - name: Extract abl.img
        shell: python
        run: |
          import os
          import sys
          import zipfile

          rom = "work/rom.zip"
          output = os.path.join(os.environ["TOOLKIT"], "images", "abl.img")

          with zipfile.ZipFile(rom) as archive:
              candidates = [
                  info for info in archive.infolist()
                  if not info.is_dir()
                  and info.filename.replace("\\", "/").lower().split("/")[-1] == "abl.img"
              ]
              if not candidates:
                  sys.exit(
                      "No abl.img found in this recovery ZIP. "
                      "Use a full HyperOS recovery ROM, not an incremental OTA or fastboot ROM."
                  )

              preferred = [
                  info for info in candidates
                  if info.filename.replace("\\", "/").lower().endswith("firmware-update/abl.img")
              ]
              selected = preferred[0] if preferred else candidates[0]
              if selected.file_size < 100_000 or selected.file_size > 100_000_000:
                  sys.exit(f"Suspicious abl.img size: {selected.file_size} bytes")

              os.makedirs(os.path.dirname(output), exist_ok=True)
              with archive.open(selected) as source, open(output, "wb") as target:
                  while chunk := source.read(1024 * 1024):
                      target.write(chunk)

          print(f"Extracted {selected.filename} ({selected.file_size:,} bytes) -> {output}")

      - name: Create fake-unlock files
        shell: bash
        working-directory: targets/toolkit_linux/build/toolkit
        run: |
          set -euo pipefail
          bash ./build.sh
          test -s efisp/boot.efi
          test -s BDS.efi
          test -s ABL_original.efi
          test -s patch_log.txt

      - name: Check patch result and prepare package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp -a "$TOOLKIT/efisp" result/
          cp "$TOOLKIT/BDS.efi" result/
          cp "$TOOLKIT/ABL_original.efi" result/
          cp "$TOOLKIT/patch_log.txt" result/
          cp "$TOOLKIT/images/abl.img" result/abl_stock.img

          if grep -q "Warning: Failed to patch ABL GBL" "$TOOLKIT/patch_log.txt"; then
            status="WARNING-NO-GBL"
            echo "::warning::The ABL was patched, but it does not contain the required GBL vulnerability. Read patch_log.txt."
          else
            status="GBL-OK"
          fi

          printf '%s\n' \
            "Generated by GitHub Actions from the supplied HyperOS recovery ROM." \
            "Status: $status" \
            "efisp/boot.efi = patched fake-lock ABL" \
            "BDS.efi = image to flash to efisp (high risk; read upstream documentation)" \
            "ABL_original.efi and abl_stock.img = backups/reference files" \
            > result/README.txt

          archive="fake-unlock-${status}-${GITHUB_RUN_NUMBER}.zip"
          (cd result && zip -r "../$archive" .)
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.artifact_days) }}

      - name: Remove downloaded ROM from runner
        if: always()
        shell: bash
        run: rm -f work/rom.zip
