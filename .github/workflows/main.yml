name: Build HyperOS fake unlock

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct HTTPS link to a HyperOS recovery ROM (.zip)"
        required: true
        type: string
      artifact_days:
        description: "Days to retain the result (1-30)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: fake-unlock-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  patch-abl:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ROM_URL: ${{ inputs.rom_url }}
      TOOLKIT: targets/toolkit_linux/build/toolkit

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$ROM_URL" in
            https://*) ;;
            *) echo "::error::rom_url must be a direct HTTPS URL"; exit 1 ;;
          esac

          days='${{ inputs.artifact_days }}'
          if ! [[ "$days" =~ ^[0-9]+$ ]] || (( days < 1 || days > 30 )); then
            echo "::error::artifact_days must be an integer from 1 to 30"
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm uuid-dev liblzma-dev zip unzip curl ca-certificates xz-utils

      - name: Set up Go for payload extraction
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build Linux toolkit
        shell: bash
        run: |
          set -euo pipefail
          make target_toolkit_linux
          test -x "$TOOLKIT/bin/extractfv"
          test -x "$TOOLKIT/bin/patch_abl"

      - name: Download recovery ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
            --output work/rom.zip "$ROM_URL"
          unzip -tq work/rom.zip >/dev/null
          echo "Downloaded: $(du -h work/rom.zip | cut -f1)"

      - name: Extract abl.img
        shell: bash
        run: |
          set -euo pipefail
          output="$TOOLKIT/images/abl.img"
          mkdir -p "$(dirname "$output")"

          # Old-style recovery ZIPs may contain abl.img as a normal ZIP entry.
          # A/B OTA ZIPs instead store the partition inside payload.bin.
          python3 <<'PY'
          import os
          import sys
          import zipfile

          rom = "work/rom.zip"
          output = os.path.join(os.environ["TOOLKIT"], "images", "abl.img")
          with zipfile.ZipFile(rom) as archive:
              files = [i for i in archive.infolist() if not i.is_dir()]
              candidates = [
                  i for i in files
                  if i.filename.replace("\\", "/").lower().split("/")[-1] == "abl.img"
              ]
              if candidates:
                  preferred = [
                      i for i in candidates
                      if i.filename.replace("\\", "/").lower().endswith("firmware-update/abl.img")
                  ]
                  selected = preferred[0] if preferred else candidates[0]
                  with archive.open(selected) as source, open(output, "wb") as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
                  print(f"Extracted direct ZIP entry: {selected.filename}")
              else:
                  has_payload = any(
                      i.filename.replace("\\", "/").lower().split("/")[-1] == "payload.bin"
                      for i in files
                  )
                  if not has_payload:
                      sys.exit("ROM ZIP contains neither abl.img nor payload.bin")
                  print("abl.img is inside payload.bin; using payload-dumper-go")
          PY

          if [[ ! -s "$output" ]]; then
            go install github.com/ssut/payload-dumper-go@v2.0.2
            mkdir -p work/payload-output
            "$(go env GOPATH)/bin/payload-dumper-go" \
              -p abl -o work/payload-output work/rom.zip
            test -s work/payload-output/abl.img
            mv work/payload-output/abl.img "$output"
          fi

          size=$(stat -c '%s' "$output")
          if (( size < 100000 || size > 100000000 )); then
            echo "::error::Suspicious abl.img size: $size bytes"
            exit 1
          fi
          echo "Ready: $output ($size bytes)"

      - name: Create fake-unlock files
        shell: bash
        working-directory: targets/toolkit_linux/build/toolkit
        run: |
          set -euo pipefail
          bash ./build.sh
          test -s efisp/boot.efi
          test -s BDS.efi
          test -s ABL_original.efi
          test -s patch_log.txt

      - name: Check patch result and prepare package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp -a "$TOOLKIT/efisp" result/
          cp "$TOOLKIT/BDS.efi" result/
          cp "$TOOLKIT/ABL_original.efi" result/
          cp "$TOOLKIT/patch_log.txt" result/
          cp "$TOOLKIT/images/abl.img" result/abl_stock.img

          if grep -q "Warning: Failed to patch ABL GBL" "$TOOLKIT/patch_log.txt"; then
            status="WARNING-NO-GBL"
            echo "::warning::The ABL was patched, but it does not contain the required GBL vulnerability. Read patch_log.txt."
          else
            status="GBL-OK"
          fi

          printf '%s\n' \
            "Generated by GitHub Actions from the supplied HyperOS recovery ROM." \
            "Status: $status" \
            "efisp/boot.efi = patched fake-lock ABL" \
            "BDS.efi = image to flash to efisp (high risk; read upstream documentation)" \
            "ABL_original.efi and abl_stock.img = backups/reference files" \
            > result/README.txt

          archive="fake-unlock-${status}-${GITHUB_RUN_NUMBER}.zip"
          (cd result && zip -r "../$archive" .)
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.artifact_days) }}

      - name: Remove downloaded ROM from runner
        if: always()
        shell: bash
        run: rm -rf work/rom.zip work/payload-output
